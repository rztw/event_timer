<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIMER DISPLAY</title>
    <style>
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #fff;
        font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      #display-time {
        font-weight: 700;
        letter-spacing: 0.1em;
        text-align: center;
        /* 在大螢幕上也能佔滿高度 */
        font-size: min(35vh, 25vw);
        line-height: 1;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="display-time"><span id="display-text">00:00</span></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="display.js"></script>
  </body>
  </html>
